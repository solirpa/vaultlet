name: Release

# Push a tag like v0.1.0 to build installers for every platform plus the browser extension
# and attach them to a draft GitHub release for review.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # tauri:build runs scripts/build-release.mjs (sidecar + path remapping).
      - name: Build installers
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  extension:
    name: Browser extension
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml
      - name: Build and zip
        working-directory: apps/extension
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          version=$(node -p "require('./dist/chrome/manifest.json').version")
          (cd dist/chrome && zip -qr "../../vaultlet-extension-chrome-$version.zip" .)
          (cd dist/firefox && zip -qr "../../vaultlet-extension-firefox-$version.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          if-no-files-found: error
          path: apps/extension/vaultlet-extension-*.zip

  android:
    name: Android APK
    runs-on: ubuntu-24.04  # the prebuilt cargo-ndk needs glibc 2.39
    # Secrets cannot be tested in `if:`; go through the job environment.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 ndk;29.0.14206865
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Rust core for Android
        run: node scripts/build-android-core.mjs
      # Signed when the repository has the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets; otherwise the APK is unsigned.
      - name: Prepare release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > "$RUNNER_TEMP/signing.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "VAULTLET_ANDROID_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"
      - name: Build the release APK
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon assembleRelease
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$apk" in *unsigned*) suffix=-unsigned;; *) suffix=;; esac
          cp "$apk" "vaultlet-android-$version$suffix.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: apps/android/vaultlet-android-*.apk

  # Unsigned .ipa: Apple distribution needs a paid developer account and its certificates, so
  # this one is for sideloading with a tool that re-signs it (AltStore, Sideloadly, Xcode).
  # Signed and uploaded to TestFlight when the repository has the IOS_* / APP_STORE_CONNECT_*
  # secrets (see README → iOS → Releases); otherwise an unsigned .ipa for re-signing by hand.
  ios:
    name: iOS app
    runs-on: macos-latest
    # Secrets cannot be tested in `if:`; go through the job environment.
    env:
      CERT_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
      PROFILE_AUTOFILL_BASE64: ${{ secrets.IOS_PROFILE_AUTOFILL_BASE64 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      # app-store-connect (TestFlight / App Store) or ad-hoc (devices listed in the profiles).
      EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the Rust core for iOS
        run: node scripts/build-ios-core.mjs
      - name: Version
        id: version
        working-directory: apps/ios
        run: |
          echo "version=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' project.yml)" >> "$GITHUB_OUTPUT"

      # ---- signed path ---------------------------------------------------------------------
      - name: Install the signing certificate and provisioning profiles
        id: signing
        if: env.CERT_P12_BASE64 != '' && env.PROFILE_APP_BASE64 != '' && env.PROFILE_AUTOFILL_BASE64 != '' && env.TEAM_ID != ''
        run: |
          set -euo pipefail
          # A throwaway keychain for this job; the login keychain is left alone.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

          # Profiles go where Xcode looks for them; their names are passed to xcodebuild.
          install_profile() { # <base64> <output-name>
            local plist="$RUNNER_TEMP/$2.plist" file="$RUNNER_TEMP/$2.mobileprovision"
            echo "$1" | base64 -d > "$file"
            security cms -D -i "$file" > "$plist"
            local uuid name
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir" && cp "$file" "$dir/$uuid.mobileprovision"
            done
            echo "$2=$name" >> "$GITHUB_OUTPUT"
          }
          install_profile "$PROFILE_APP_BASE64" profile_app
          install_profile "$PROFILE_AUTOFILL_BASE64" profile_autofill

      - name: Archive (signed)
        if: steps.signing.outcome == 'success'
        working-directory: apps/ios
        env:
          PROFILE_APP: ${{ steps.signing.outputs.profile_app }}
          PROFILE_AUTOFILL: ${{ steps.signing.outputs.profile_autofill }}
        run: |
          set -euo pipefail
          # One profile per target: the specifier is looked up through the product name, so
          # a single command line can hand each target its own profile ($(...) is for Xcode).
          # shellcheck disable=SC2016
          xcodebuild archive -project Vaultlet.xcodeproj -scheme Vaultlet -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Vaultlet.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" \
            'PROVISIONING_PROFILE_SPECIFIER=$(VAULTLET_PROFILE_$(PRODUCT_NAME))' \
            "VAULTLET_PROFILE_Vaultlet=$PROFILE_APP" "VAULTLET_PROFILE_VaultletAutoFill=$PROFILE_AUTOFILL" | tail -40
          test "${PIPESTATUS[0]}" -eq 0

      - name: Export the .ipa
        if: steps.signing.outcome == 'success'
        working-directory: apps/ios
        env:
          PROFILE_APP: ${{ steps.signing.outputs.profile_app }}
          PROFILE_AUTOFILL: ${{ steps.signing.outputs.profile_autofill }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.vaultlet.ios</key><string>$PROFILE_APP</string>
              <key>com.vaultlet.ios.autofill</key><string>$PROFILE_AUTOFILL</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Vaultlet.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" | tail -20
          test "${PIPESTATUS[0]}" -eq 0
          mv "$RUNNER_TEMP/export/Vaultlet.ipa" "vaultlet-ios-$VERSION.ipa"

      - name: Upload to TestFlight
        if: steps.signing.outcome == 'success' && env.EXPORT_METHOD == 'app-store-connect' && env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_BASE64 != ''
        working-directory: apps/ios
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # altool looks for the key in ./private_keys or ~/private_keys.
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_BASE64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f "vaultlet-ios-$VERSION.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "${{ steps.signing.outputs.keychain }}"

      # ---- unsigned path -------------------------------------------------------------------
      - name: Archive (unsigned)
        if: steps.signing.outcome == 'skipped'
        working-directory: apps/ios
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild archive -project Vaultlet.xcodeproj -scheme Vaultlet -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Vaultlet.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= | tail -40
          test "${PIPESTATUS[0]}" -eq 0
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Vaultlet.xcarchive/Products/Applications/Vaultlet.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/apps/ios/vaultlet-ios-$VERSION-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          if-no-files-found: error
          path: apps/ios/vaultlet-ios-*.ipa

  publish:
    name: Draft GitHub release
    needs: [desktop, extension, android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          # Artifacts keep their bundle subfolders (msi/, nsis/, dmg/, ...).
          files: dist/**/*
