name: Release

# Push a tag like v0.1.0 to build installers for every platform plus the browser extension
# and attach them to a draft GitHub release for review.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # tauri:build runs scripts/build-release.mjs (sidecar + path remapping).
      - name: Build installers
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  extension:
    name: Browser extension
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml
      - name: Build and zip
        working-directory: apps/extension
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          version=$(node -p "require('./dist/chrome/manifest.json').version")
          (cd dist/chrome && zip -qr "../../vaultlet-extension-chrome-$version.zip" .)
          (cd dist/firefox && zip -qr "../../vaultlet-extension-firefox-$version.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          if-no-files-found: error
          path: apps/extension/vaultlet-extension-*.zip

  android:
    name: Android APK
    runs-on: ubuntu-24.04  # the prebuilt cargo-ndk needs glibc 2.39
    # Secrets cannot be tested in `if:`; go through the job environment.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 ndk;29.0.14206865
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Rust core for Android
        run: node scripts/build-android-core.mjs
      # Signed when the repository has the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
      # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets; otherwise the APK is unsigned.
      - name: Prepare release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > "$RUNNER_TEMP/signing.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "VAULTLET_ANDROID_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"
      - name: Build the release APK
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon assembleRelease
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$apk" in *unsigned*) suffix=-unsigned;; *) suffix=;; esac
          cp "$apk" "vaultlet-android-$version$suffix.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: apps/android/vaultlet-android-*.apk

  # Unsigned .ipa: Apple distribution needs a paid developer account and its certificates, so
  # this one is for sideloading with a tool that re-signs it (AltStore, Sideloadly, Xcode).
  ios:
    name: iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the Rust core for iOS
        run: node scripts/build-ios-core.mjs
      - name: Archive
        working-directory: apps/ios
        run: |
          xcodebuild archive -project Vaultlet.xcodeproj -scheme Vaultlet -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Vaultlet.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= | tail -40
          test ${PIPESTATUS[0]} -eq 0
          version=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' project.yml)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Vaultlet.xcarchive/Products/Applications/Vaultlet.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/apps/ios/vaultlet-ios-$version-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          if-no-files-found: error
          path: apps/ios/vaultlet-ios-*-unsigned.ipa

  publish:
    name: Draft GitHub release
    needs: [desktop, extension, android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          # Artifacts keep their bundle subfolders (msi/, nsis/, dmg/, ...).
          files: dist/**/*
