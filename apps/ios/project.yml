# XcodeGen spec for the iOS app (iPhone + iPad) and its Password AutoFill extension.
# `Vaultlet.xcodeproj` is generated from this file (`xcodegen generate`, or
# `node scripts/build-ios-core.mjs`, which also builds the Rust core).
name: Vaultlet
options:
  bundleIdPrefix: com.vaultlet
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    # Set your team here or in Signing & Capabilities (the app group and the AutoFill
    # capability need a development team).
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: "NO"
targets:
  Vaultlet:
    type: application
    platform: iOS
    sources:
      - path: Vaultlet/Sources
      - path: Vaultlet/Assets.xcassets
      - path: Shared
      - path: Generated
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaultlet.ios
        PRODUCT_NAME: Vaultlet
        INFOPLIST_FILE: Vaultlet/Info.plist
        CODE_SIGN_ENTITLEMENTS: Vaultlet/Vaultlet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VaultletAutoFill
      - framework: Frameworks/VaultFFI.xcframework
        embed: false
    scheme:
      testTargets: []
  VaultletAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: VaultletAutoFill/Sources
      - path: Shared
      - path: Generated
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vaultlet.ios.autofill
        PRODUCT_NAME: VaultletAutoFill
        INFOPLIST_FILE: VaultletAutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: VaultletAutoFill/VaultletAutoFill.entitlements
        SKIP_INSTALL: "YES"
    dependencies:
      - framework: Frameworks/VaultFFI.xcframework
        embed: false
