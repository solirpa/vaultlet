[package]
name = "vault-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vaultlet core: KDBX 4 vault model, Bitwarden import, TOTP, URL matching, two-way merge, WebDAV sync"

[dependencies]
keepass = { version = "0.17", features = ["save_kdbx4"] }
# `rust-argon2` is the crate keepass uses for its KDF settings (lib name `argon2`);
# we reuse it for the Bitwarden Argon2id export KDF as well.
rust-argon2 = "3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
csv = "1"
totp-rs = { version = "6", features = ["otpauth"] }
psl = "2"
url = "2"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.4"
pbkdf2 = { version = "0.13", features = ["hmac"] }
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
cipher = { version = "0.5", features = ["alloc", "block-padding"] }
base64 = "0.23"
base32 = "0.5"
percent-encoding = "2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots"] }
directories = "6"

# reqwest checks certificates with rustls-platform-verifier, which on Android needs a JNI init
# that the UniFFI/JNA bindings can't do; trust the bundled Mozilla roots there instead.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[dev-dependencies]
tempfile = "3"
ciborium = "0.2"
